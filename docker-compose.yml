version: "3.8"

services:
  travel-planner:
    build: .
    ports:
      - "8501:8501"
    volumes:
      # 持久化：向量库 + 数据库 + 日志不丢
      - ./rag/chroma_db:/app/rag/chroma_db
      - ./db:/app/db
      - ./logs:/app/logs
    environment:
      - APP_ENV=${APP_ENV:-dev}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
    restart: unless-stopped
